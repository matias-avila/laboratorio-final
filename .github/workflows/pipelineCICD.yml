name: Pipeline CI/CD

on:
  push:
    branches:
      - creacion-yml-ci-cd

permissions:
  pull-requests: read
jobs:
  Analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Analyze with SonarCloud

        uses: SonarSource/sonarcloud-github-action@4006f663ecaf1f8093e8e4abb9227f6041f52216
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args:
            -Dsonar.projectKey=matias-avila_laboratorio-final
            -Dsonar.organization=matias-avila
          projectBaseDir: .
